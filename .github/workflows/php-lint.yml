name: Validación de sintaxis PHP

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Comprobar todos los archivos PHP propios
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' ! -path './library/*' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done
